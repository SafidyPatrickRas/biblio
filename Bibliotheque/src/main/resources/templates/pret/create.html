<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="mb-0"><i class="fas fa-exclamation-triangle icon-lg me-2"></i>Ajouter une pénalité</h3>
                        <a th:href="@{/penalites/list}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Retour à la liste
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <form th:action="@{/penalites/create}" method="post" class="needs-validation" novalidate>
                        <!-- Sélection de l'adhérent -->
                        <div class="form-group mb-4">
                            <label for="adherant" class="form-label">Adhérent:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-user text-primary"></i>
                                </span>
                                <input list="adherants" id="adherant" name="adherant" 
                                       class="form-control" required placeholder="Rechercher un adhérent..."/>
                                <datalist id="adherants">
                                    <option th:each="adherant : ${adherants}" th:value="${adherant.email}"></option>
                                </datalist>
                            </div>
                        </div>

                        <!-- Date de début -->
                        <div class="form-group mb-4">
                            <label for="dateDebut" class="form-label">Date de début:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-calendar-day text-primary"></i>
                                </span>
                                <input type="date" id="dateDebut" name="dateDebut" 
                                       class="form-control" required/>
                            </div>
                        </div>

                        <!-- Nombre de jours -->
                        <div class="form-group mb-4">
                            <label for="nombreJours" class="form-label">Nombre de jours:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-calendar-week text-primary"></i>
                                </span>
                                <input type="number" id="nombreJours" name="nombreJours" 
                                       class="form-control" required min="1" placeholder="Nombre de jours de pénalité"/>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus me-2"></i>Ajouter la pénalité
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
