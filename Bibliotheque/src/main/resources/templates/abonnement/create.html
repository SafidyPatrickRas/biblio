<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-header">
                    <h3 class="mb-0"><i class="fas fa-id-card-alt icon-lg me-2"></i>Ajouter un abonnement</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/abonnement/create}" method="post" class="needs-validation" novalidate>
                        <!-- Sélection de l'adhérent -->
                        <div class="form-group mb-4">
                            <label for="adherant" class="form-label">Adhérent:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-user text-primary"></i>
                                </span>
                                <input type="text" list="adherants" id="adherant" name="adherant" 
                                       class="form-control" required placeholder="Sélectionnez un adhérent">
                                <datalist id="adherants">
                                    <option th:each="adherant : ${adherants}"
                                            th:value="${adherant.email}"
                                            th:text="${adherant.nom + ' ' + adherant.prenom + ' - ' + adherant.email}">
                                    </option>
                                </datalist>
                            </div>
                        </div>

                        <!-- Date d'inscription -->
                        <div class="form-group mb-4">
                            <label for="dateInscription" class="form-label">Date d'inscription:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-calendar text-primary"></i>
                                </span>
                                <input type="date" id="dateInscription" name="dateInscription" 
                                       class="form-control" required>
                            </div>
                        </div>

                        <!-- Date de fin -->
                        <div class="form-group mb-4">
                            <label for="dateFinInscription" class="form-label">Date de fin:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-calendar-check text-primary"></i>
                                </span>
                                <input type="date" id="dateFinInscription" name="dateFinInscription" 
                                       class="form-control" required>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus me-2"></i>Ajouter
                            </button>
                            <a th:href="@{/abonnement/list}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
