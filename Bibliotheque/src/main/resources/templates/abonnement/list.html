<div class="container mt-4">
    <!-- En-tête de page -->
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-id-card-alt icon-lg me-2"></i>Liste des Abonnements</h2>
            <a th:href="@{/abonnement/create}" class="btn btn-primary">
                <i class="fas fa-plus-circle me-1"></i> Ajouter un abonnement
            </a>
        </div>
        <hr class="border-primary">
    </div>

    <!-- Tableau des abonnements -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Adhérent</th>
                            <th>Date d'inscription</th>
                            <th>Date de fin</th>
                            <th>Statut</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="abonnement : ${abonnements}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="avatar-sm me-3">
                                        <i class="fas fa-user-circle fa-2x text-muted"></i>
                                    </div>
                                    <div>
                                        <div th:text="${abonnement.adherant.nom + ' ' + abonnement.adherant.prenom}" class="fw-bold"></div>
                                        <div th:text="${abonnement.adherant.email}" class="text-muted small"></div>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${abonnement.dateInscription}"></td>
                            <td th:text="${abonnement.dateFinInscription}"></td>
                            <td>
                                <!-- Solution alternative pour le statut sans temporals -->
                                <span th:if="${abonnement.dateFinInscription.time &gt; new java.util.Date().time}" 
                                      class="badge bg-success">
                                    Actif
                                </span>
                                <span th:if="${abonnement.dateFinInscription.time &lt;= new java.util.Date().time}" 
                                      class="badge bg-danger">
                                    Expiré
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group" role="group">
                                    <a th:href="@{/abonnement/{id}/edit(id=${abonnement.id})}" 
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger"
                                            data-bs-toggle="modal" 
                                            th:attr="data-bs-target='#deleteModal-' + ${abonnement.id}">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                                
                                <!-- Modal de suppression -->
                                <div class="modal fade" th:id="'deleteModal-' + ${abonnement.id}" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Confirmer la suppression</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>Êtes-vous sûr de vouloir supprimer l'abonnement de 
                                                   <span th:text="${abonnement.adherant.nom}"></span> ?</p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                                                <form th:action="@{/abonnement/{id}/delete(id=${abonnement.id})}" method="post">
                                                    <button type="submit" class="btn btn-danger">Supprimer</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center mt-4">
        <div class="text-muted" th:if="${abonnements.size() > 0}">
            Affichage de <span th:text="${abonnements.size()}"></span> abonnements
        </div>
        <nav th:if="${totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/abonnements(page=${currentPage - 1})}">Précédent</a>
                </li>
                <li th:each="page : ${#numbers.sequence(1, totalPages)}" 
                    class="page-item" th:classappend="${page == currentPage} ? 'active' : ''">
                    <a class="page-link" th:href="@{/abonnements(page=${page})}" th:text="${page}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/abonnements(page=${currentPage + 1})}">Suivant</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
