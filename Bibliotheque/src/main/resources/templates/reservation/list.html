<div class="container mt-4">
    <!-- En-tête -->
    <div class="page-header mb-4">
        <h2><i class="fas fa-bookmark icon-lg me-2"></i>Liste des réservations</h2>
        <hr class="border-primary">
    </div>

    <!-- Tableau -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Adhérent</th>
                            <th>Livre</th>
                            <th>Date de réservation</th>
                            <th>Statut</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reservation : ${reservations}">
                            <td class="ps-4" th:text="${reservation.adherant.email}"></td>
                            <td th:text="${reservation.livre.titre}"></td>
                            <td th:text="${reservation.dateReservation}"></td>
                            <td>
                                <span th:switch="${reservation.status.nom}" class="badge">
                                    <span th:case="'Envoyé'" class="bg-warning">En attente</span>
                                    <span th:case="'Accepté'" class="bg-success">Accepté</span>
                                    <span th:case="'Refusé'" class="bg-danger">Refusé</span>
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <div th:if="${reservation.status.nom == 'Envoyé'}" class="btn-group">
                                    <form th:action="@{/reservations/accept}" method="post" class="d-inline">
                                        <input type="hidden" name="reservationId" th:value="${reservation.id}">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            <i class="fas fa-check me-1"></i> Accepter
                                        </button>
                                    </form>
                                    <form th:action="@{/reservations/refuse}" method="post" class="d-inline ms-1">
                                        <input type="hidden" name="reservationId" th:value="${reservation.id}">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-times me-1"></i> Refuser
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
