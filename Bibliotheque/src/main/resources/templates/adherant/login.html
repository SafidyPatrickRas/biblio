<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card form-card">
                <div class="card-header">
                    <h3><i class="fas fa-sign-in-alt icon-lg me-2"></i>Connexion</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/adherants/login}" method="post" class="needs-validation" novalidate>
                        <!-- Email -->
                        <div class="form-group mb-4">
                            <label for="email" class="form-label">Email:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-envelope text-primary"></i>
                                </span>
                                <input type="email" id="email" name="email" 
                                       class="form-control" required placeholder="votre@email.com">
                            </div>
                        </div>

                        <!-- Mot de passe -->
                        <div class="form-group mb-4">
                            <label for="motDePasse" class="form-label">Mot de passe:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-primary"></i>
                                </span>
                                <input type="password" id="motDePasse" name="motDePasse" 
                                       class="form-control" required placeholder="Votre mot de passe">
                            </div>
                        </div>

                        <!-- Options -->
                        <div class="d-flex justify-content-between mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">
                                    Se souvenir de moi
                                </label>
                            </div>
                            <a href="/adherants/inscription" class="text-primary text-decoration-none">
                                <i class="fas fa-user-plus me-1"></i>S'inscrire
                            </a>
                        </div>

                        <!-- Bouton de soumission -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                            </button>
                        </div>

                        <!-- Liens secondaires -->
                        <div class="form-footer-links">
                            <p>Retour à la <a th:href="@{/}">page d'accueil</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
