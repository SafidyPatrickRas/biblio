<div class="container mt-4">
    <!-- En-tête -->
    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-list-ul icon-lg me-2"></i>Liste des pénalités</h2>
            <a th:href="@{/penalites/create}" class="btn btn-primary">
                <i class="fas fa-plus-circle me-1"></i>Ajouter une pénalité
            </a>
        </div>
        <hr class="border-primary">
    </div>

    <!-- Tableau -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Adhérent</th>
                            <th>Date de début</th>
                            <th>Date de fin</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="penalite : ${penalites}">
                            <td class="ps-4" th:text="${penalite.adherant.email}"></td>
                            <td th:text="${penalite.dateDebut}"></td>
                            <td th:text="${penalite.dateFin}"></td>
                            <td>
                                <span th:if="${#dates.createNow().time < penalite.dateFin.time}" 
                                      class="badge bg-warning">Active</span>
                                <span th:if="${#dates.createNow().time >= penalite.dateFin.time}" 
                                      class="badge bg-success">Terminée</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
